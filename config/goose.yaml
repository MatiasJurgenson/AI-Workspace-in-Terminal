GOOSE_MAX_TOKENS: 50000
GOOSE_TELEMETRY_ENABLED: false
extensions:
  skills:
    enabled: true
    type: platform
    name: skills
    description: Discover and provide skill instructions from filesystem and builtins
    display_name: Skills
    bundled: true
  summarize:
    enabled: true
    type: platform
    name: summarize
    description: Load files/directories and get an LLM summary in a single call
    display_name: Summarize
    bundled: true
  tom:
    enabled: true
    type: platform
    name: tom
    description: Inject custom context into every turn via GOOSE_MOIM_MESSAGE_TEXT and GOOSE_MOIM_MESSAGE_FILE environment variables
    display_name: Top Of Mind
    bundled: true
  analyze:
    enabled: true
    type: platform
    name: analyze
    description: 'Analyze code structure with tree-sitter: directory overviews, file details, symbol call graphs'
    display_name: Analyze
    bundled: true
  code_execution:
    enabled: false
    type: platform
    name: code_execution
    description: Goose will make extension calls through code execution, saving tokens
    display_name: Code Mode
    bundled: true
  apps:
    enabled: true
    type: platform
    name: apps
    description: Create and manage custom Goose apps through chat. Apps are HTML/CSS/JavaScript and run in sandboxed windows.
    display_name: Apps
    bundled: true
  summon:
    enabled: true
    type: platform
    name: summon
    description: Load knowledge and delegate tasks to subagents
    display_name: Summon
    bundled: true
  chatrecall:
    enabled: true
    type: platform
    name: chatrecall
    description: Search past conversations and load session summaries for contextual memory
    display_name: Chat Recall
    bundled: true
  extensionmanager:
    enabled: true
    type: platform
    name: Extension Manager
    description: Enable extension management tools for discovering, enabling, and disabling extensions
    display_name: Extension Manager
    bundled: true
  todo:
    enabled: true
    type: platform
    name: todo
    description: Enable a todo list for goose so it can keep track of what it is doing
    display_name: Todo
    bundled: true
  scheduler:
    enabled: true
    type: platform
    name: scheduler
    description: Create and manage scheduled recipe execution
    display_name: Scheduler
    bundled: true
  developer:
    enabled: true
    type: platform
    name: developer
    description: Write and edit files, and execute shell commands
    display_name: Developer
    bundled: true
  web-search:
    enabled: true
    type: stdio
    name: web-search
    description: Search the web and read URLs
    cmd: npx
    args:
    - -y
    - mcp-searxng
    envs:
      SEARXNG_URL: http://localhost:8888
    env_keys: []
    timeout: 300
    cwd: null
    bundled: null
active_provider: custom_llamacpp
providers:
  ollama:
    enabled: true
    model: qwen2.5:7b
    configured: true
  custom_llamacpp:
    enabled: true
    model: ~/llamacpp/models/qwen2.5-14b-instruct-q8_0-00001-of-00004.gguf
    configured: true
  openai:
    enabled: true
    model: qwen2.5:14b:Q8_0
    configured: true
GOOSE_MAX_TURNS: 1000
OLLAMA_HOST: localhost
GOOSE_MODE: auto
OPENAI_HOST: http://localhost:11433
OPENAI_BASE_PATH: v1/chat/completions