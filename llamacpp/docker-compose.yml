services:
  llamacpp:
    build: 
      dockerfile: Dockerfile
    image: local/llama-cli:rocm
    container_name: llamacpp

    ports:
      - "11433:8080"

    volumes:
      - ${HOME}/llamacpp/models:/models

    group_add:
      - video
      - render
    
    devices:
      - /dev/kfd
      - /dev/dri
    
    security_opt:
      - seccomp=unconfined
    environment:
      - HSA_OVERRIDE_GFX_VERSION=11.0.0

    stdin_open: true
    tty: true
    restart: unless-stopped
