services:
  ollama:
    build: 
      dockerfile: Dockerfile
    image: local/ollama:rocm
    container_name: ollama

    ports:
      - "11434:11434"

    volumes:
      - ${HOME}/ollama/data:/root/.ollama

    group_add:
      - video
      - render
    
    devices:
      - /dev/kfd
      - /dev/dri
    
    security_opt:
      - seccomp=unconfined
    environment:
      - HSA_OVERRIDE_GFX_VERSION=11.0.0

    stdin_open: true
    tty: true
    restart: unless-stopped
